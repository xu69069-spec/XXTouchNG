# Build XXTouchNG (TIPA) - v21
# Based on the author's own CI recipe (Lessica/TrollSpeed, build-release.yml)
# Milestone 1: make package -> .deb artifact
#
# v20 change: bypass theos' parse-swiftc-output filter -> revealed the real
#    error: "invalid argument '-std=c++14' not allowed with 'Objective-C'"
#
# v21 change: libtfcookiesmanager_CCFLAGS= (empty). theos forwards every
#    C/CC/ObjC flag to swiftc as -Xcc (rules.mk:179); cookies/Makefile sets
#    CCFLAGS=-std=c++14, and Swift 6's clang importer refuses any -std=c++*
#    when compiling the (Objective-C) bridging-header PCH -> "clang importer
#    creation failed". Clearing CCFLAGS only drops -std=c++14; the instance's
#    three ObjC++ files fall back to clang's default gnu++17 (fine for
#    2022-era bridge code).
#
# v18 change: libtfcontainermanager_WEAK_LIBRARIES= (empty). app/Makefile:30
#    declares the weak library as a PATH ("lib/libapplist"); old ld silently
#    ignored missing weak libraries, Xcode 16's ld errors out, and for
#    slash-style -l args it does not consult -L search paths at all, so tbd
#    stubs can never satisfy it. Clearing the var is semantically equivalent:
#    weak = optional at runtime, and all dylibs already link with
#    -undefined dynamic_lookup so symbols resolve at runtime anyway.
#
# v17 change: mk_stub now mkdir -p's the parent directory before writing.
#    Some leaked -l args are path-style ("lib/liblibapplibst"), so the stub
#    filename contains a slash and the plain redirect failed with
#    "No such file or directory", burning all retries.
#
# v16 change: auto-stub loop. On "ld: library 'X' not found" the build step
#    generates an empty tbd stub (lib + X + .tbd) and retries, ending the
#    whack-a-mole of leaked -l flags from aggregated subproject .ldflags.
#
# v5 changes:
#  - Dropped the "patched SDK" step entirely: theos/sdks master no longer ships
#    create_patched_sdk.py (removed in theos/sdks@0222fd54), which is why the
#    job died with "python3: can't open file ... exit code 2".
#    XXTouchNG's Makefile pins TARGET iphone:clang:14.5, so it uses the
#    prebuilt iPhoneOS14.5.sdk straight from theos/sdks - no patching needed.
#    (TrollSpeed's own CI does exactly this: plain theos/sdks + brew deps.)
#  - Removed tbd build + SDK cache steps (no longer needed).
#  - Added: remove theos vendor openssl (README says XXTouchNG ships its own).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  XCODE_VERSION: "16.2"

jobs:
  build:
    name: Build daemons + package
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      # ==== theos env (author-maintained fork, pinned commit) ====
      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Set THEOS env + prepare SDKs
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks
          # XXTouchNG ships its own OpenSSL headers - avoid header clash
          rm -rf $GITHUB_WORKSPACE/theos/vendor/include/openssl
          # README "IMPORTANT": export THEOS_OBJ_DIR so recipes (liblua/tbdump.sh)
          # see it; without this $THEOS_OBJ_DIR is empty -> "Failed to open ./liblua.dylib"
          echo "export THEOS_OBJ_DIR" >> $GITHUB_WORKSPACE/theos/makefiles/common.mk
          # Swift (libtfcookiesmanager): Xcode 16 Swift 6 generate-pch fails and
          # theos' parse-swiftc-output filter swallows the underlying clang
          # error. Strip the filter + -parseable-output so raw swiftc output
          # (with the real generate-pch error) lands in the build log.
          sed -i '' -e 's# -parseable-output 2>&1##' \
                    -e 's#| $(TARGET_SWIFT_SUPPORT_BIN)/parse-swiftc-output $(or $(call __theos_bool,$(COLOR)),0) $(_THEOS_SWIFT_MUTEX) $(THEOS_CURRENT_ARCH)##' \
            $GITHUB_WORKSPACE/theos/makefiles/instance/rules.mk
          grep -c "parse-swiftc-output" $GITHUB_WORKSPACE/theos/makefiles/instance/rules.mk || true
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          # Xcode 16+ no longer falls back to toolchain libc++ headers when the
          # sysroot lacks them, and theos/sdks SDKs carry no C++ headers at all
          # -> "fatal error: 'string' file not found" when compiling .cpp/.mm.
          # Symlink Xcode's iOS SDK c++ headers into every theos iOS SDK.
          XCODE_SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          for sdk in $GITHUB_WORKSPACE/theos/sdks/iPhoneOS*.sdk; do
            ln -sfn "$XCODE_SDK/usr/include/c++" "$sdk/usr/include/c++"
          done
          echo "Linked c++ headers from $XCODE_SDK into theos sdks"

      # ==== main repo (LFS + submodules) ====
      - name: Checkout XXTouchNG
        uses: actions/checkout@v4
        with:
          path: XXTouchNG
          submodules: recursive
          lfs: true

      # ==== build with auto-stubbing of missing libraries ====
      # The aggregate build leaks -l flags from earlier subprojects' .ldflags
      # files into every later link; some point at libraries that exist nowhere
      # ("ld: library 'liblibzpkt' not found" - the quoted name is the -l
      # argument verbatim, ld searches for "lib" + name + ".dylib/.tbd").
      # Every dylib links with -undefined dynamic_lookup, so no link-time
      # symbols are actually needed - only the library FILES must exist.
      # Strategy: on "library 'X' not found", generate an empty arm64+arm64e
      # tbd stub ${THEOS}/stublibs/libX.tbd and retry (make is incremental,
      # retries are fast). At runtime the real libs are used.
      - name: Build daemons + package (deb)
        # GO_EASY_ON_ME=1: theos' -Werror kills 2022-era code under Xcode 16 clang
        # _THEOS_DARWIN_CAN_USE_MODULES= (empty): kill -fmodules (extern "C" import errors)
        # libdebugwindow_FRAMEWORKS=UIKit: no framework autolinking with modules off
        # ADDITIONAL_CFLAGS=-include sys/types.h: BSD types for kern_memorystatus.h
        # ADDITIONAL_LDFLAGS=-Wl,-undefined,dynamic_lookup: hook libs resolve at
        #   runtime; + -Wl,-not_for_dyld_shared_cache: new ld requires opting out
        # libtfcontainermanager_LDFLAGS: -L$(THEOS_OBJ_DIR) to find built libzmq
        run: |
          set -o pipefail
          mkdir -p ${THEOS}/stublibs
          mk_stub() {
            # $1 is the verbatim -l argument; ld searches for "lib" + arg + ext,
            # so the stub filename mirrors that (may contain slashes for
            # path-style args like "lib/liblibapplibst" - create parents first)
            local f="${THEOS}/stublibs/lib$1.tbd"
            mkdir -p "$(dirname "$f")"
            printf '%s\n' \
              '--- !tapi-tbd-v3' \
              'archs:           [ arm64, arm64e ]' \
              'platform:        ios' \
              "install-name:    /usr/lib/lib$1.dylib" \
              'current-version: 0' \
              'compatibility-version: 0' \
              'exports:' \
              '  - archs:           [ arm64, arm64e ]' \
              '    symbols:         [ ]' \
              '...' \
              > "$f"
          }
          # known offenders up front so the first pass usually succeeds
          for n in z zpkt libz libzpkt liblibzpkt pthread ffi curl nghttp2 uv ev crypto ssl zip archive iconv; do
            mk_stub "$n"
          done
          cd XXTouchNG
          ARGS=(GO_EASY_ON_ME=1 _THEOS_DARWIN_CAN_USE_MODULES=
                libdebugwindow_FRAMEWORKS=UIKit
                libtfcontainermanager_WEAK_LIBRARIES=
                libtfcookiesmanager_CCFLAGS=
                ADDITIONAL_CFLAGS="-include sys/types.h"
                ADDITIONAL_LDFLAGS="-Wl,-undefined,dynamic_lookup -Wl,-not_for_dyld_shared_cache -L${THEOS}/stublibs"
                'libtfcontainermanager_LDFLAGS=-L$(THEOS_OBJ_DIR) $(LUA_MOD_LDFLAGS)'
                FINALPACKAGE=1 TARGET_CODESIGN_CERT=-)
          build() {
            local a m MISSING
            for a in 1 2 3 4 5 6; do
              if make package "${ARGS[@]}" "$@" 2>&1 | tee /tmp/build.log; then
                return 0
              fi
              MISSING=$(grep -o "library '[^']*' not found" /tmp/build.log | sed -E "s/library '([^']*)' not found/\1/" | sort -u)
              if [ -z "$MISSING" ]; then
                return 1
              fi
              echo "::notice::Auto-stubbing missing libraries: $MISSING"
              for m in $MISSING; do
                mk_stub "$m"
              done
            done
            return 1
          }
          if ! build; then
            echo "::notice::Falling back to arm64-only build"
            build FINALPACKAGE_ARCHS=arm64
          fi

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: XXTouchNG-deb
          path: XXTouchNG/packages/*.deb
