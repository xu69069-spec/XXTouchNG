.github/workflows/build.yml
name: Build XXTouchNG (TIPA)
# 初版工作流 —— 基于 XXTouchNG 作者本人(Lessica)在 TrollSpeed 项目用的云编译配方
# 用法: fork XXTouchNG/XXTouchNG 后, 把本文件放到 .github/workflows/build.yml
#       Actions 页面手动触发(workflow_dispatch)或 push 触发
# 产物: Actions 页面底部 Artifacts 下载 XXTouchNG-deb (第一里程碑)
# 注意: 首次运行大概率报错, 把报错日志发回来迭代修改 (这是预期内的调试过程)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  XCODE_VERSION: "14.3.1"

jobs:
  build:
    name: Build daemons + package
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build dependencies
        run: |
          brew install dpkg ldid make libplist openssl@3
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      # ===== theos 环境 (作者维护的 XXTouchNG/theos 分支, 固定 commit 保证可复现) =====
      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Set THEOS env
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Restore SDK cache
        id: sdks-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: sdks-${{ env.XCODE_VERSION }}

      - if: steps.sdks-restore.outputs.cache-hit != 'true'
        name: Prepare SDKs (theos/sdks + tbd + patched sdk)
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git ${{ env.THEOS }}/sdks
          git clone https://github.com/XXTouchNG/tbd.git tbd
          cd tbd && make && cp bin/tbd /usr/local/bin/tbd
          cd ${{ env.THEOS }}/sdks
          python3 create_patched_sdk.py --no-overwrite \
            -x $(dirname $(dirname $(xcode-select -p)))

      - name: Save SDK cache
        if: steps.sdks-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: sdks-${{ env.XCODE_VERSION }}

      # ===== 主仓库: XXTouchNG 源码 (含 LFS 与子模块) =====
      - name: Checkout XXTouchNG
        uses: actions/checkout@v4
        with:
          path: XXTouchNG
          submodules: recursive
          lfs: true

      - name: Build daemons + package (deb)
        # TrollStore 不校验签名 => 用 ad-hoc("-") 代替作者的 Developer ID 证书
        run: |
          cd XXTouchNG
          make package FINALPACKAGE=1 TARGET_CODESIGN_CERT="-" \
            || make package FINALPACKAGE=1 TARGET_CODESIGN_CERT="-" FINALPACKAGE_ARCHS=arm64

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: XXTouchNG-deb
          path: XXTouchNG/packages/*.deb

  # ===== 里程碑2: 组装 TIPA (首个里程碑跑通后再启用/迭代) =====
  # 思路: explorer 目标用 xcodebuild 出 XXTExplorer.app (macOS runner 自带 Xcode, 无需真 Mac),
  #       与 deb 里 layout 的守护进程合并成 Payload/ 打包成 .tipa, ldid 伪签名
  #启用前先把上面 job 跑通, 再按报错逐步放开本段
