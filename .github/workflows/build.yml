# Build XXTouchNG (TIPA) - v4
# Based on the author's own CI recipe (Lessica/TrollSpeed)
# Milestone 1: make package -> .deb artifact
#
# v4 changes:
#  - macos-13 image has been RETIRED by GitHub (jobs queue forever), now macos-15 (arm64)
#  - Xcode 14.3.1 no longer exists on any hosted image, now Xcode 16.2 (available on macos-15)
#  - Homebrew prefix is /opt/homebrew on arm64 (was /usr/local on Intel)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  XCODE_VERSION: "16.2"

jobs:
  build:
    name: Build daemons + package
    # macos-15 = arm64 standard (free for public repos). macos-14 is deprecated (2026-11),
    # macos-26 is too new. "macos-15-large" (Intel) is a paid larger runner — avoid.
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install build dependencies
        run: |
          brew install dpkg ldid make libplist openssl@3
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      # ==== theos env (author-maintained fork, pinned commit) ====
      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Set THEOS env
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Restore SDK cache
        id: sdks-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: sdks-${{ env.XCODE_VERSION }}

      - if: steps.sdks-restore.outputs.cache-hit != 'true'
        name: Prepare SDKs (theos/sdks + tbd + patched sdk)
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git ${{ env.THEOS }}/sdks
          git clone https://github.com/XXTouchNG/tbd.git tbd
          cd tbd && make && cp bin/tbd /usr/local/bin/tbd
          cd ${{ env.THEOS }}/sdks
          python3 create_patched_sdk.py --no-overwrite \
            -x $(dirname $(dirname $(xcode-select -p)))

      - name: Save SDK cache
        if: steps.sdks-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: sdks-${{ env.XCODE_VERSION }}

      # ==== main repo (LFS + submodules) ====
      - name: Checkout XXTouchNG
        uses: actions/checkout@v4
        with:
          path: XXTouchNG
          submodules: recursive
          lfs: true

      - name: Build daemons + package (deb)
        # TrollStore does not verify signatures => ad-hoc sign ("-") instead of dev cert
        run: |
          cd XXTouchNG
          make package FINALPACKAGE=1 TARGET_CODESIGN_CERT="-" \
            || make package FINALPACKAGE=1 TARGET_CODESIGN_CERT="-" FINALPACKAGE_ARCHS=arm64

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: XXTouchNG-deb
          path: XXTouchNG/packages/*.deb
